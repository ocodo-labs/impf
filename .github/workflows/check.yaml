name: Check Install

on:
  push:
  pull_request:

jobs:
  check-install:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File "$env:GITHUB_PATH" -Append

      - name: Verify uv
        shell: bash
        run: uv --version

      - name: Install impf
        shell: bash
        if: runner.os != 'Windows'
        run: make install

      - name: Install impf
        shell: pwsh
        if: runner.os == 'Windows'
        run: ./install.ps1

      - name: Check installation
        shell: bash
        run: |
          {
            echo "## impf installation"
            echo
            echo "**OS:** $RUNNER_OS"
            echo
            echo '```text'
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              echo "PATH:"
              printf '%s\n' "$PATH"
              echo
              echo "Installed files:"
              find "$LOCALAPPDATA" -iname 'impf*' -type f 2>/dev/null || true
            else
              echo "Expected: /usr/local/bin/impf"
              echo
              ls -la /usr/local/bin/impf 2>&1 || true
              echo
              file /usr/local/bin/impf 2>&1 || true
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RUNNER_OS" != "Windows" ]]; then
            [[ -x /usr/local/bin/impf ]]
          fi
