name: Check Install

on:
  push:
  pull_request:

jobs:
  check-install:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"

      - name: Verify uv
        shell: bash
        run: |
          uv --version

      - name: Install impf on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make install

      - name: Install impf on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1

      - name: Check impf is in PATH on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          command -v impf
          impf --help

      - name: Check impf is in PATH on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command impf
          impf --help
