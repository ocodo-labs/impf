name: Check Install

on:
  push:
  pull_request:

jobs:
  check-install-unix:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify uv
        run: uv --version

      - name: Install impf
        run: sudo make install

      - name: Check impf is installed
        run: |
          echo "## impf install — $RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if [[ -x /usr/local/bin/impf ]]; then
            echo "✅ \`/usr/local/bin/impf\` is installed and executable." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ \`/usr/local/bin/impf\` is missing or not executable." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  check-install-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex

      - name: Verify uv
        shell: pwsh
        run: uv --version

      - name: Install impf
        shell: pwsh
        run: ./install.ps1

      - name: Check impf is installed
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:LOCALAPPDATA "Programs\impf\impf.ps1"

          Add-Content $env:GITHUB_STEP_SUMMARY "## impf install — $env:RUNNER_OS"
          Add-Content $env:GITHUB_STEP_SUMMARY ""

          if (Test-Path -LiteralPath $scriptPath -PathType Leaf) {
            Add-Content $env:GITHUB_STEP_SUMMARY "✅ ``$scriptPath`` is installed."
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY "❌ ``$scriptPath`` is missing."
            exit 1
          }
