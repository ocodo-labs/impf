name: Check Install

on:
  push:
  pull_request:

jobs:
  check-install:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify uv
        shell: bash
        run: |
          uv --version

      - name: Install impf on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "Installing impf..."
          ./install.sh

      - name: Install impf on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Installing impf..."
          ./install.ps1

      - name: Check impf is installed on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "Checking /usr/local/bin/impf..."
          ls -la /usr/local/bin/impf
          [[ -x /usr/local/bin/impf ]]
          echo "impf is installed and executable."

      - name: Check impf is installed on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:LOCALAPPDATA "Programs\impf\impf.ps1"
          Write-Host "Checking $scriptPath..."
          Get-Item $scriptPath
          if (-not (Test-Path -Path $scriptPath -PathType Leaf)) {
            throw "impf was not installed at $scriptPath"
          }
          Write-Host "impf is installed."
